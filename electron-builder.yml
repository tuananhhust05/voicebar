appId: io.github.tuananhhust05.voicebar
productName: Voicebar
copyright: Copyright © 2026 tuananhhust05

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**
  - package.json
  - '!**/*.map'

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # Swift Apple Speech helper (native/macos/SpeechHelper), built before packaging
    - from: native/macos/.build/release/speech-helper
      to: bin/speech-helper
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Voicebar listens to your spoken question after you press the shortcut.
    NSSpeechRecognitionUsageDescription: Voicebar turns your speech into text so it can be sent to Claude.

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false

publish:
  provider: github
  owner: tuananhhust05
  repo: voicebar
  releaseType: draft
